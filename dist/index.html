<!DOCTYPE html><html lang="uk"><head><link rel="stylesheet" href="/hw-7.9f367d21.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Каталог товарів на Handlebars і Parcel">
    <title>Product catalog</title>
  </head>
  <body>
    <main class="page-container">
      <header class="hero">
        <p class="hero__eyebrow">Handlebars + Parcel</p>
        <h1>Каталог товарів</h1>
        <p class="hero__text">Додавайте позиції та видаляйте непотрібні зі списку.</p>
      </header>

      <section class="panel" aria-labelledby="add-product-title">
        <h2 id="add-product-title">Додати товар</h2>
        <form class="product-form" id="product-form">
          <label>
            Назва
            <input name="name" type="text" required="" minlength="2" placeholder="Наприклад, Keyboard">
          </label>
          <label>
            Ціна, $
            <input name="price" type="number" required="" min="0" step="0.01" placeholder="99.99">
          </label>
          <label class="product-form__full-width">
            Опис
            <textarea name="description" required="" minlength="5" placeholder="Коротко опишіть товар"></textarea>
          </label>
          <button type="submit">Додати до каталогу</button>
        </form>
      </section>

      <section aria-labelledby="catalog-title">
        <div class="catalog-heading">
          <h2 id="catalog-title">Усі товари</h2>
          <p id="products-count" aria-live="polite"></p>
        </div>
        <ul class="products" id="products-list"></ul>
      </section>
    </main>
    <script type="module" src="/hw-7.6528c13b.js"></script>
  

</body></html>
